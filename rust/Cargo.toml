# SOURCED FILE — do not edit this copy; it is overwritten on the next data sync.

[package]
name = "fellowship-data"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
description = "Fellowship game data — heroes, abilities, items, enemies — as a Rust library"
readme = "README.md"
license = "MIT"
keywords = ["game-data", "dataset", "gamedev"]
repository = "https://github.com/kevs-enterprises/fellowship-data"
# The crate lives in a subdirectory of a five-delivery monorepo, not at the repository root.
# crates.io links straight to `repository`, so this is the difference between a visitor landing on
# the crate's own source and landing on a directory listing with no Cargo.toml in sight.
homepage = "https://github.com/kevs-enterprises/fellowship-data/tree/main/rust"

# No dependencies, and that is the point. The data is `&'static` source, so there is nothing to
# parse and nothing to deserialize. A browser build pays only for the domains it enables.
#
# Deliberately absent: `wasm-bindgen`, `serde`, and any `cdylib` crate-type. This library does not
# assume it is going to a browser; a consumer targeting one exposes the shape it wants.
[dependencies]

[features]
# A consumer that only lays out gear never compiles the 440 enemy difficulty curves.
default = ["heroes", "abilities", "items", "attributes", "constants"]

heroes = []
abilities = []
talents = []
items = []
attributes = []
constants = []
effects = []
modifiers = []
dungeons = []
# ~440 curves of 151 points. Real weight if you do not need enemy scaling.
mobs = []
traits = []
set_bonuses = []
finesses = []
relic_powers = []
# 13,070 rows. Only needed to map a gameplay tag to the engine's numeric id.
tag_ids = []
combat_constants = []
# 12,927 rows. The numbers behind every ability's mechanics; `abilities` carries the resolved
# subset each ability actually references, so this is only needed to look one up by name.
ability_constants = []
# The 22 native classes an effect's `Executions` array can reference; `effects` already carries
# the resolved subset each effect references, so this is only needed to enumerate them.
effect_executions = []

[lints.rust]
unsafe_code = "forbid"

# The crate is generated, so keeping `pedantic` clean costs nothing and catches emitter bugs.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
